<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Scisors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Paper and Scisors</h1>
    </header>
    <section id="user">
        <h2>Choose Your Play:</h2>
        <button class="user-choice" value="paper" id="paper" >Paper</button>
        <button class="user-choice" value="scisors" id="scissors">Scissors</button>
        <button class="user-choice" value="rock" id="rock">Rock</button>
    </section>

    <section id="result">
        <h3>Result:</h3>
        <p id="result-text"></p>
        <h2 id="final-result"></h2>
    </section>

    <script src="script.js"></script>
</body>
</html>
